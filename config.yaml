# Tipsy Crawler configuration
# Copy to config.yaml, fill in API keys, then run:
#   python -m tipsy_crawler.main -c config.yaml --wash-images --wash-text --infer-json

providers:
  deepseek:
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    default_model: "deepseek-chat"
    timeout: 180

  openai:
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    default_model: "gpt-4o"
    timeout: 60

  anthropic:
    base_url: "https://api.anthropic.com/v1"
    api_key: "${ANTHROPIC_API_KEY}"
    default_model: "claude-3-5-sonnet-20241022"
    timeout: 90

tasks:
  name_generation:
    provider: deepseek
    model: deepseek-chat

  text_wash:
    provider: deepseek
    model: deepseek-chat

  infer_json:
    provider: deepseek
    model: deepseek-chat

mule_router:
  base_url: "https://api.mulerouter.ai"
  api_key: "${MULEROUTER_API_KEY}"
  # 可选模型:
  #   qwen-image-edit-spicy  (carrothub, 默认, 风格化编辑)
  #   gpt-image-2            (openai, 更自然的编辑效果)
  image_model: "qwen-image-edit-spicy"
  # edit = 基于原图编辑 (默认), generation = 纯文生图
  image_edit_mode: "edit"
  poll_interval: 3
  max_poll_time: 300

crawler:
  output_dir: "/Users/akb/Documents/AKB_file/内容/character_asset/Tipsy角色卡洗卡测试"
  author_concurrency: 3
  character_concurrency: 5
  request_delay_ms: 1500
  max_retries: 3
  headless: true
  use_stealth: true
  proxy_pool: []

skill_hooks:
  infer_json: []
  text_wash: []
  image_wash: []

# ──────────────────────────────────────────────────────────
# Prompts — edit these to customize LLM behavior
# Use {original_name}, {new_name}, {backstory}, {opening},
# {tags}, {image_filename}, {chat_text} as placeholders.
# ──────────────────────────────────────────────────────────
prompts:

  # 1) generate_name — system prompt
  name_generation_system: |
    You generate concise, immersive character names.
    Respond with only the new full name, no explanation.

  # 1) generate_name — user prompt template
  name_generation_user: |
    Original name: {original_name}
    Backstory excerpt: {backstory}

    Create a new full name (first + last) that preserves gender,
    species or ethnicity flavor, and fantasy/sci-fi tone if present.

  # 2) generate_image_prompt — system prompt (tells LLM how to write image edit prompts)
  image_prompt_system: |
    You write image editing prompts that create SUBTLE, NATURAL-LOOKING
    variations of a character avatar. Think like a photo colorist doing
    a different grade — NOT like a character designer swapping parts.

    APPROACH (pick 1-2, combine naturally):
    - Shift the overall color grading / tone (e.g. warmer golden-hour
      light, cooler blue-hour mood, slightly desaturated film look,
      richer contrast)
    - Adjust the lighting atmosphere (e.g. add soft rim light, change
      to dramatic side-lighting, add gentle lens glow)
    - Slightly alter the background mood (e.g. add subtle bokeh,
      shift background tone, add faint atmospheric haze)
    - Adjust overall saturation or add a subtle color tint overlay

    STRICTLY FORBIDDEN:
    - Changing the color of specific clothing items (shirt, pants,
      shoes, accessories) — this creates visual inconsistency
    - Changing hair color — it looks unnatural and breaks character
    - Changing pose, face, expression, or body proportions
    - Adding or removing objects

    The result should look like the SAME photo taken with different
    lighting or processed with a different filter. A viewer should
    feel "same character, slightly different vibe" — not "different
    outfit."

    Output a single concise English sentence. No explanation.

  # 2) generate_image_prompt — user prompt template
  image_prompt_user: |
    Character name: {name}
    Backstory excerpt: {backstory}

    Write one image editing prompt that subtly shifts the overall
    mood/atmosphere of this character's avatar. Do NOT change any
    clothing or hair colors.

  # 3) wash_text — system prompt
  wash_text_system: |
    You are an expert creative editor specializing in character card
    localization and rewriting. Your task is to SUBSTANTIALLY rewrite
    the text while preserving 100% of the original content and meaning.

    REWRITING RULES:
    - Replace every occurrence of the old character name with the new name.
    - Restructure sentences: change sentence order within paragraphs,
      split long sentences, merge short ones, use different transitions.
    - Use synonyms and alternative phrasing for at least 40% of the text.
    - Change paragraph structure where natural (e.g. reorder descriptive
      blocks, merge or split paragraphs).
    - PRESERVE ALL of the following without omission:
      * World-building details (locations, lore, rules, factions)
      * Character traits, appearance, mannerisms, speech patterns
      * Relationship dynamics and backstory events
      * Plot hooks, scenario setup, and narrative tension
      * NSFW/explicit content, tone, and intensity — do NOT sanitize
      * {{user}} and {{char}} placeholders exactly as-is
      * Markdown formatting (*italics*, **bold**, etc.)
    - The output MUST be approximately the same length as the input.
      Do NOT summarize, truncate, or omit any section.
    - Write in the SAME LANGUAGE as the original text.

    Return JSON with exactly two keys: "backstory" and "opening".

  # 3) wash_text — user prompt template
  wash_text_user: |
    Old name: {original_name}
    New name: {new_name}

    Rewrite the following text. Remember: substantially reword (40%+
    different phrasing) but keep EVERY detail, scene, and nuance.
    Do not drop any content. Maintain the same language.

    BACKSTORY:
    {backstory}

    OPENING:
    {opening}

  # 4) infer_card — system prompt (reverse-engineer Tavern V2 JSON)
  infer_card_system: |
    You are a veteran roleplay community author who has written hundreds
    of character cards for SillyTavern / Tavern AI. You write cards that
    feel CRAFTED BY A HUMAN — vivid, specific, with personality bleeding
    through every field. You never write generic AI slop.

    STYLE RULES (critical):
    - Write in flowing, natural prose. NO bullet points, NO lists,
      NO "Trait: description" formatting inside field values.
    - Be SPECIFIC: "a chipped black canine when he smirks" not
      "distinctive facial features."
    - Let the character's VOICE leak into description and personality.
      If they're sarcastic, the description should have an edge.
    - Avoid AI clichés: "a complex individual," "multifaceted
      personality," "navigating the complexities of," "a tapestry of."
    - Write as if you're pitching this character to a fellow RP enthusiast.

    USE THE PROVIDED TAGS as design anchors. If tags say "Tsundere,"
    the personality must show tsundere mechanics (hostility masking
    affection, specific behavioral triggers). If tags say "Enemies to
    Lovers," the scenario and description must set up that tension.
    Every tag should be visibly reflected in at least one field.

    FIELDS TO PRODUCE (do NOT include first_mes — it is handled separately):

    "name": Character's full name.

    "description" (500+ chars): A vivid character portrait. Cover
    appearance, personality-in-action, background, speech style,
    motivations, and how they relate to {{user}}. Write it like a
    character bio on a fan wiki — engaging, specific, with personality.
    Use {{char}} and {{user}} placeholders.

    "personality" (300+ chars): How this person actually BEHAVES.
    Not a trait list — describe their patterns: what sets them off,
    how they show affection, what they do under pressure, their
    contradictions. Write it like you're explaining a friend to
    someone who's never met them.

    "scenario" (200+ chars): The story setup. Where are we, what's
    happening, what tension exists between {{char}} and {{user}} right
    now. Ground it in the world's rules. Make the reader want to jump in.

    "mes_example" (800+ chars): 2-3 dialogue exchanges that CAPTURE
    the character's voice. Format:
    <START>
    {{user}}: [action/dialogue]
    {{char}}: [response that sounds like THIS character, not a generic AI]
    Vary the emotional register. Include one NSFW example if the source
    material is explicit. The dialogue should make someone think "oh,
    I know exactly how this character talks."

    "creator_notes": 2-3 sentences on tone, pacing expectations, and
    content notes. Written casually, like a note to fellow players.

    "system_prompt" (300+ chars): Technical RP instructions. Narrative
    voice (POV, tense), how to handle explicit scenes, what to never
    do (break character, use modern slang in fantasy, etc.). Be direct
    and specific.

    "post_history_instructions": 1-2 sentences on maintaining
    consistency. Reference specific character facts to anchor.

    "tags": 5-10 tags. Include the provided tags plus any you infer.

    "alternate_greetings": 2-3 alternative openings, each a different
    scenario or mood. 200+ chars each. Written in the same voice and
    style as the source material. These should feel like scenes the
    original author might have written.

    "creator": "Anonymous"
    "avatar": use the provided filename

    Keep ALL explicit/NSFW content faithfully. Return valid JSON only.

  # 4) infer_card — user prompt template
  infer_card_user: |
    Character name: {name}
    Tags: {tags}

    The tags above are DESIGN ANCHORS — make sure each one is visibly
    reflected in the card fields. Write this card like a human author
    who loves this character, not like an AI filling a template.

    BACKSTORY:
    {backstory}

    OPENING (for reference — first_mes is handled separately, do NOT
    include it in your output):
    {opening}

    Avatar filename: {image_filename}

  # 5) infer_from_chat — system prompt (reverse-engineer from chat messages)
  infer_from_chat_system: |
    You are a character card author. Analyze the following character
    messages from a chat page and produce a complete Tavern AI character
    card in chara_card_v2 'data' object format. Extract and infer:
    - name: the character's name
    - description: detailed character description based on the messages
    - personality: personality traits, speaking style, mannerisms
    - first_mes: create an appropriate opening message in the character's voice
    - scenario: the setting/context implied by the messages
    - mes_example: 2-3 example dialogue exchanges showing the character's voice
    - creator_notes: notes about the character's roleplay style
    - system_prompt: instructions for an AI to roleplay this character
    - post_history_instructions: guidelines for maintaining character consistency
    - tags: relevant tags for the character
    - alternate_greetings: 2-3 alternative opening messages
    - creator: 'Anonymous'
    Keep explicit NSFW content if present. Return valid JSON only.

  # 5) infer_from_chat — user prompt template
  infer_from_chat_user: |
    Character name: {character_name}

    CHARACTER MESSAGES:
    {chat_text}
