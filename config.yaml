# Tipsy Crawler configuration
# Copy to config.yaml, fill in API keys, then run:
#   python -m tipsy_crawler.main -c config.yaml --wash-images --wash-text --infer-json

providers:
  deepseek:
    base_url: "https://api.deepseek.com"
    api_key: "${DEEPSEEK_API_KEY}"
    default_model: "deepseek-chat"
    timeout: 180

  openai:
    base_url: "https://api.openai.com/v1"
    api_key: "${OPENAI_API_KEY}"
    default_model: "gpt-4o"
    timeout: 60

  anthropic:
    base_url: "https://api.anthropic.com/v1"
    api_key: "${ANTHROPIC_API_KEY}"
    default_model: "claude-3-5-sonnet-20241022"
    timeout: 90

tasks:
  name_generation:
    provider: deepseek
    model: deepseek-chat

  text_wash:
    provider: deepseek
    model: deepseek-chat

  infer_json:
    provider: deepseek
    model: deepseek-chat

mule_router:
  base_url: "https://api.mulerouter.ai"
  api_key: "${MULEROUTER_API_KEY}"
  # 可选模型:
  #   qwen-image-edit-spicy  (carrothub, 默认, 风格化编辑)
  #   gpt-image-2            (openai, 更自然的编辑效果)
  image_model: "qwen-image-edit-spicy"
  # edit = 基于原图编辑 (默认), generation = 纯文生图
  image_edit_mode: "edit"
  poll_interval: 3
  max_poll_time: 300

crawler:
  output_dir: "/Users/akb/Documents/AKB_file/内容/character_asset/Tipsy角色卡洗卡测试"
  author_concurrency: 3
  character_concurrency: 5
  request_delay_ms: 1500
  max_retries: 3
  headless: true
  use_stealth: true
  proxy_pool: []

skill_hooks:
  infer_json: []
  text_wash: []
  image_wash: []

# ──────────────────────────────────────────────────────────
# Prompts — edit these to customize LLM behavior
# Use {original_name}, {new_name}, {backstory}, {opening},
# {tags}, {image_filename}, {chat_text} as placeholders.
# ──────────────────────────────────────────────────────────
prompts:

  # 1) generate_name — system prompt
  name_generation_system: |
    You generate concise, immersive character names.
    Respond with only the new full name, no explanation.

  # 1) generate_name — user prompt template
  name_generation_user: |
    Original name: {original_name}
    Backstory excerpt: {backstory}

    Create a new full name (first + last) that preserves gender,
    species or ethnicity flavor, and fantasy/sci-fi tone if present.

  # 2) generate_image_prompt — system prompt (tells LLM how to write image edit prompts)
  image_prompt_system: |
    You write concise image editing prompts for an AI image editor.
    The goal is to slightly alter a character's avatar so it looks
    different from the original while still fitting the character's
    personality and aesthetic.
    Rules:
    - NEVER use pink or pastel pink hair.
    - Pick hair/outfit colors that match the character's vibe
      (e.g. dark tones for villains, warm tones for heroes, etc.).
    - Keep changes subtle: shift color palette, adjust outfit style,
      add/remove small accessories.
    - Keep pose, face structure, expression, and background unchanged.
    - Output a single English sentence, no explanation.

  # 2) generate_image_prompt — user prompt template
  image_prompt_user: |
    Character name: {name}
    Backstory excerpt: {backstory}

    Write one image editing prompt for this character.

  # 3) wash_text — system prompt
  wash_text_system: |
    You are an expert creative editor specializing in character card
    localization and rewriting. Your task is to SUBSTANTIALLY rewrite
    the text while preserving 100% of the original content and meaning.

    REWRITING RULES:
    - Replace every occurrence of the old character name with the new name.
    - Restructure sentences: change sentence order within paragraphs,
      split long sentences, merge short ones, use different transitions.
    - Use synonyms and alternative phrasing for at least 40% of the text.
    - Change paragraph structure where natural (e.g. reorder descriptive
      blocks, merge or split paragraphs).
    - PRESERVE ALL of the following without omission:
      * World-building details (locations, lore, rules, factions)
      * Character traits, appearance, mannerisms, speech patterns
      * Relationship dynamics and backstory events
      * Plot hooks, scenario setup, and narrative tension
      * NSFW/explicit content, tone, and intensity — do NOT sanitize
      * {{user}} and {{char}} placeholders exactly as-is
      * Markdown formatting (*italics*, **bold**, etc.)
    - The output MUST be approximately the same length as the input.
      Do NOT summarize, truncate, or omit any section.
    - Write in the SAME LANGUAGE as the original text.

    Return JSON with exactly two keys: "backstory" and "opening".

  # 3) wash_text — user prompt template
  wash_text_user: |
    Old name: {original_name}
    New name: {new_name}

    Rewrite the following text. Remember: substantially reword (40%+
    different phrasing) but keep EVERY detail, scene, and nuance.
    Do not drop any content. Maintain the same language.

    BACKSTORY:
    {backstory}

    OPENING:
    {opening}

  # 4) infer_card — system prompt (reverse-engineer Tavern V2 JSON)
  infer_card_system: |
    You are an expert character card author for Tavern AI / SillyTavern.
    Produce a COMPLETE chara_card_v2 "data" object by deeply analyzing
    the provided backstory and opening message.

    FIELD-BY-FIELD REQUIREMENTS:

    "name": The character's full name.

    "description" (500+ chars): Comprehensive character profile covering:
    - Physical appearance (body type, hair, eyes, distinguishing features)
    - Core personality traits with behavioral examples
    - Background summary (origin, occupation, key life events)
    - Speech patterns, verbal tics, language style
    - Likes, dislikes, fears, motivations
    - Relationship to {{user}} and how they interact
    Use {{char}} for the character name and {{user}} for the user.

    "personality" (300+ chars): Detailed personality breakdown including:
    - Dominant traits (e.g. tsundere, stoic, flirtatious) with nuance
    - How they behave under stress, in combat, in intimate scenes
    - Contradictions and complexity in their character
    - Moral alignment and ethical boundaries

    "first_mes": Use the provided opening text verbatim. This is critical.

    "scenario" (200+ chars): The setting and situation context:
    - Where and when the story takes place
    - The world's rules (supernatural elements, technology level)
    - The initial situation that brings {{char}} and {{user}} together
    - Any ongoing conflicts or tensions

    "mes_example" (800+ chars): 2-3 example dialogue exchanges in this
    exact format:
    <START>
    {{user}}: [user action/dialogue]
    {{char}}: [character response showing their voice, mannerisms]
    Include at least one NSFW example if the character has explicit content.
    Each exchange should demonstrate a different emotional register.

    "creator_notes": Brief notes on roleplay style, tone expectations,
    and any content warnings.

    "system_prompt" (300+ chars): Detailed instructions for the AI:
    - How to embody {{char}}'s personality consistently
    - Narrative style (POV, tense, prose density)
    - How to handle NSFW scenes (pacing, detail level, language)
    - What to avoid (breaking character, modern slang if fantasy, etc.)

    "post_history_instructions": Reminders for maintaining consistency
    across long conversations (stay in character, remember established
    facts, escalate tension naturally).

    "tags": 5-10 relevant tags (genre, tropes, character archetypes).

    "alternate_greetings": Array of 2-3 alternative opening messages,
    each showing a different scenario or mood. Each should be 200+ chars
    and written in the same style as first_mes.

    "creator": "Anonymous"
    "avatar": use the provided avatar filename

    Keep ALL explicit/NSFW content. Return valid JSON only, no markdown.

  # 4) infer_card — user prompt template
  infer_card_user: |
    Character name: {name}
    Tags: {tags}

    Analyze the following material deeply and produce a rich, detailed
    character card. Every field must be thorough — do not write thin
    or generic descriptions.

    BACKSTORY:
    {backstory}

    OPENING (use as first_mes verbatim):
    {opening}

    Avatar filename: {image_filename}

  # 5) infer_from_chat — system prompt (reverse-engineer from chat messages)
  infer_from_chat_system: |
    You are a character card author. Analyze the following character
    messages from a chat page and produce a complete Tavern AI character
    card in chara_card_v2 'data' object format. Extract and infer:
    - name: the character's name
    - description: detailed character description based on the messages
    - personality: personality traits, speaking style, mannerisms
    - first_mes: create an appropriate opening message in the character's voice
    - scenario: the setting/context implied by the messages
    - mes_example: 2-3 example dialogue exchanges showing the character's voice
    - creator_notes: notes about the character's roleplay style
    - system_prompt: instructions for an AI to roleplay this character
    - post_history_instructions: guidelines for maintaining character consistency
    - tags: relevant tags for the character
    - alternate_greetings: 2-3 alternative opening messages
    - creator: 'Anonymous'
    Keep explicit NSFW content if present. Return valid JSON only.

  # 5) infer_from_chat — user prompt template
  infer_from_chat_user: |
    Character name: {character_name}

    CHARACTER MESSAGES:
    {chat_text}
